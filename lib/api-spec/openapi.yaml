openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
  description: HR Management System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: employees
    description: Employee management
  - name: attendance
    description: Attendance & WFH tracking
  - name: leave
    description: Leave management
  - name: onboarding
    description: Onboarding checklists
  - name: assets
    description: Asset management
  - name: kra
    description: KRA & Performance management
  - name: reports
    description: Reports & analytics
  - name: admin
    description: Admin & configuration
  - name: automations
    description: Automations & email notifications

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/user:
    get:
      operationId: getCurrentAuthUser
      tags: [auth]
      summary: Get current auth user
      responses:
        "200":
          description: Current auth user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetCurrentAuthUserResponse"

  # ── EMPLOYEES ────────────────────────────────────────────────────
  /employees:
    get:
      operationId: listEmployees
      tags: [employees]
      summary: List all employees
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: department
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: designation
          schema:
            type: string
      responses:
        "200":
          description: List of employees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Employee"
    post:
      operationId: createEmployee
      tags: [employees]
      summary: Create new employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmployeeBody"
      responses:
        "201":
          description: Created employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"

  /employees/{id}:
    get:
      operationId: getEmployee
      tags: [employees]
      summary: Get employee by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          description: Not found
    patch:
      operationId: updateEmployee
      tags: [employees]
      summary: Update employee
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmployeeBody"
      responses:
        "200":
          description: Updated employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
    delete:
      operationId: deleteEmployee
      tags: [employees]
      summary: Delete employee
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /employees/{id}/documents:
    get:
      operationId: listEmployeeDocuments
      tags: [employees]
      summary: List employee documents
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeDocument"
    post:
      operationId: uploadEmployeeDocument
      tags: [employees]
      summary: Upload employee document
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadDocumentBody"
      responses:
        "201":
          description: Created document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeDocument"

  /employees/{id}/history:
    get:
      operationId: getEmployeeHistory
      tags: [employees]
      summary: Get promotion/transfer history
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: History
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeHistory"
    post:
      operationId: addEmployeeHistory
      tags: [employees]
      summary: Add history entry
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddEmployeeHistoryBody"
      responses:
        "201":
          description: History entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeHistory"

  /org-chart:
    get:
      operationId: getOrgChart
      tags: [employees]
      summary: Get org chart hierarchy
      responses:
        "200":
          description: Org chart
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrgChartNode"

  # ── ATTENDANCE ────────────────────────────────────────────────────
  /attendance/clock-in:
    post:
      operationId: clockIn
      tags: [attendance]
      summary: Clock in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClockInBody"
      responses:
        "201":
          description: Attendance record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecord"

  /attendance/clock-out:
    post:
      operationId: clockOut
      tags: [attendance]
      summary: Clock out
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClockOutBody"
      responses:
        "200":
          description: Updated attendance record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecord"

  /attendance/wfh:
    post:
      operationId: markWfh
      tags: [attendance]
      summary: Mark WFH for the day
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkWfhBody"
      responses:
        "201":
          description: WFH record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecord"

  /attendance/today:
    get:
      operationId: getTodayAttendance
      tags: [attendance]
      summary: Get today's attendance for current user
      responses:
        "200":
          description: Today's attendance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecord"

  /attendance/monthly:
    get:
      operationId: getMonthlyAttendance
      tags: [attendance]
      summary: Get monthly attendance summary
      parameters:
        - in: query
          name: month
          required: true
          schema:
            type: integer
        - in: query
          name: year
          required: true
          schema:
            type: integer
        - in: query
          name: employeeId
          schema:
            type: string
      responses:
        "200":
          description: Monthly attendance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceRecord"

  /attendance/team:
    get:
      operationId: getTeamAttendance
      tags: [attendance]
      summary: Get team attendance for today
      responses:
        "200":
          description: Team attendance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamAttendanceEntry"

  /attendance/overtime:
    post:
      operationId: logOvertime
      tags: [attendance]
      summary: Log overtime hours
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OvertimeLogBody"
      responses:
        "201":
          description: Overtime log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OvertimeLog"

  /holidays:
    get:
      operationId: listHolidays
      tags: [attendance]
      summary: List holidays for a year
      parameters:
        - in: query
          name: year
          schema:
            type: integer
      responses:
        "200":
          description: Holidays
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Holiday"
    post:
      operationId: createHoliday
      tags: [attendance]
      summary: Create holiday
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHolidayBody"
      responses:
        "201":
          description: Holiday
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Holiday"

  /holidays/{id}:
    delete:
      operationId: deleteHoliday
      tags: [attendance]
      summary: Delete holiday
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  # ── LEAVE ────────────────────────────────────────────────────
  /leave/types:
    get:
      operationId: listLeaveTypes
      tags: [leave]
      summary: List leave types
      responses:
        "200":
          description: Leave types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaveType"
    post:
      operationId: createLeaveType
      tags: [leave]
      summary: Create leave type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeaveTypeBody"
      responses:
        "201":
          description: Leave type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveType"

  /leave/balances:
    get:
      operationId: getLeaveBalances
      tags: [leave]
      summary: Get leave balances for an employee
      parameters:
        - in: query
          name: employeeId
          schema:
            type: string
      responses:
        "200":
          description: Leave balances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaveBalance"

  /leave/requests:
    get:
      operationId: listLeaveRequests
      tags: [leave]
      summary: List leave requests
      parameters:
        - in: query
          name: employeeId
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: managerId
          schema:
            type: string
      responses:
        "200":
          description: Leave requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaveRequest"
    post:
      operationId: applyLeave
      tags: [leave]
      summary: Apply for leave
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyLeaveBody"
      responses:
        "201":
          description: Leave request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequest"

  /leave/requests/{id}/approve:
    post:
      operationId: approveLeave
      tags: [leave]
      summary: Approve leave request
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaveActionBody"
      responses:
        "200":
          description: Updated leave request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequest"

  /leave/requests/{id}/reject:
    post:
      operationId: rejectLeave
      tags: [leave]
      summary: Reject leave request
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaveActionBody"
      responses:
        "200":
          description: Updated leave request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequest"

  /leave/compoff:
    get:
      operationId: listCompoffs
      tags: [leave]
      summary: List comp-off records
      parameters:
        - in: query
          name: employeeId
          schema:
            type: string
      responses:
        "200":
          description: Comp-offs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Compoff"
    post:
      operationId: createCompoff
      tags: [leave]
      summary: Create comp-off credit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCompoffBody"
      responses:
        "201":
          description: Comp-off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Compoff"

  /leave/calendar:
    get:
      operationId: getLeaveCalendar
      tags: [leave]
      summary: Get team leave calendar
      parameters:
        - in: query
          name: month
          required: true
          schema:
            type: integer
        - in: query
          name: year
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Leave calendar entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaveCalendarEntry"

  # ── ONBOARDING ────────────────────────────────────────────────────
  /onboarding/checklists:
    get:
      operationId: listOnboardingChecklists
      tags: [onboarding]
      summary: List onboarding checklists
      parameters:
        - in: query
          name: employeeId
          schema:
            type: string
      responses:
        "200":
          description: Checklists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OnboardingChecklist"
    post:
      operationId: createOnboardingChecklist
      tags: [onboarding]
      summary: Create onboarding checklist for employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOnboardingChecklistBody"
      responses:
        "201":
          description: Checklist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingChecklist"

  /onboarding/tasks/{id}/complete:
    post:
      operationId: completeOnboardingTask
      tags: [onboarding]
      summary: Mark onboarding task as complete
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingTask"

  # ── ASSETS ────────────────────────────────────────────────────
  /assets:
    get:
      operationId: listAssets
      tags: [assets]
      summary: List assets
      parameters:
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: assignedTo
          schema:
            type: string
      responses:
        "200":
          description: Assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"
    post:
      operationId: createAsset
      tags: [assets]
      summary: Create asset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssetBody"
      responses:
        "201":
          description: Asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"

  /assets/{id}:
    get:
      operationId: getAsset
      tags: [assets]
      summary: Get asset
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
    patch:
      operationId: updateAsset
      tags: [assets]
      summary: Update asset
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAssetBody"
      responses:
        "200":
          description: Asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"

  /assets/{id}/assign:
    post:
      operationId: assignAsset
      tags: [assets]
      summary: Assign asset to employee
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignAssetBody"
      responses:
        "200":
          description: Asset assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetAssignment"

  /assets/{id}/return:
    post:
      operationId: returnAsset
      tags: [assets]
      summary: Return asset from employee
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnAssetBody"
      responses:
        "200":
          description: Asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"

  /assets/categories:
    get:
      operationId: listAssetCategories
      tags: [assets]
      summary: List asset categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssetCategory"
    post:
      operationId: createAssetCategory
      tags: [assets]
      summary: Create asset category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssetCategoryBody"
      responses:
        "201":
          description: Category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetCategory"

  # ── KRA / PERFORMANCE ────────────────────────────────────────────────────
  /kra/templates:
    get:
      operationId: listKraTemplates
      tags: [kra]
      summary: List KRA templates
      responses:
        "200":
          description: KRA templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KraTemplate"
    post:
      operationId: createKraTemplate
      tags: [kra]
      summary: Create KRA template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKraTemplateBody"
      responses:
        "201":
          description: KRA template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KraTemplate"

  /kra/review-cycles:
    get:
      operationId: listReviewCycles
      tags: [kra]
      summary: List review cycles
      responses:
        "200":
          description: Review cycles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewCycle"
    post:
      operationId: createReviewCycle
      tags: [kra]
      summary: Create review cycle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewCycleBody"
      responses:
        "201":
          description: Review cycle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewCycle"

  /kra/review-cycles/{id}/close:
    post:
      operationId: closeReviewCycle
      tags: [kra]
      summary: Close a review cycle
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Closed cycle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewCycle"

  /kra/assignments:
    get:
      operationId: listKraAssignments
      tags: [kra]
      summary: List KRA assignments
      parameters:
        - in: query
          name: employeeId
          schema:
            type: string
        - in: query
          name: cycleId
          schema:
            type: string
      responses:
        "200":
          description: KRA assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KraAssignment"
    post:
      operationId: createKraAssignment
      tags: [kra]
      summary: Assign KRA to employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKraAssignmentBody"
      responses:
        "201":
          description: KRA assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KraAssignment"

  /kra/assignments/{id}/self-assess:
    post:
      operationId: submitSelfAssessment
      tags: [kra]
      summary: Submit self assessment
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelfAssessmentBody"
      responses:
        "200":
          description: Updated assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KraAssignment"

  /kra/assignments/{id}/manager-rate:
    post:
      operationId: submitManagerRating
      tags: [kra]
      summary: Submit manager rating
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagerRatingBody"
      responses:
        "200":
          description: Updated assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KraAssignment"

  # ── REPORTS ────────────────────────────────────────────────────
  /reports/headcount:
    get:
      operationId: getHeadcountReport
      tags: [reports]
      summary: Get headcount report
      responses:
        "200":
          description: Headcount report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeadcountReport"

  /reports/attendance:
    get:
      operationId: getAttendanceReport
      tags: [reports]
      summary: Get monthly attendance report
      parameters:
        - in: query
          name: month
          required: true
          schema:
            type: integer
        - in: query
          name: year
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Attendance report
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceReportEntry"

  /reports/lop:
    get:
      operationId: getLopReport
      tags: [reports]
      summary: Get LOP report
      parameters:
        - in: query
          name: month
          required: true
          schema:
            type: integer
        - in: query
          name: year
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: LOP report
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LopReportEntry"

  /reports/attrition:
    get:
      operationId: getAttritionReport
      tags: [reports]
      summary: Get attrition report
      parameters:
        - in: query
          name: year
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Attrition report
          content:
            application/json:
