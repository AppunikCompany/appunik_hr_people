  /api/staff-jwt-api-token-auth/:
    post:
      operationId: api_staff_jwt_api_token_auth_create
      description: |-
        API View that receives a POST with a user's username and password.

        Returns a JSON Web Token that can be used for authenticated requests.
      tags:
      - - Api Token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JSONWebTokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/JSONWebTokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/JSONWebTokenRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONWebToken'
          description: ''
      parameters: []
  /iclock/api/biodatas/:
    get:
      operationId: iclock_api_biodatas_list
      description: BioDataList pagination, search, filter, order
      parameters:
      - in: query
        name: bio_index
        schema:
          type: string
        description: '`Template Index`'
      - in: query
        name: bio_no
        schema:
          type: string
        description: '`Bio-Index`'
      - in: query
        name: bio_type
        schema:
          type: integer
          enum:
          - 1
          - 10
          - 2
          - 5
          - 8
          - 9
        description: |-
          * `1` - Fingerprint
          * `2` - Face
          * `5` - Finger Vein
          * `8` - Palm
          * `9` - VLFace
          * `10` - VLPalm
      - in: query
        name: emp_code
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.`Default-10`
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: sn
        schema:
          type: string
      tags:
      - - Bio Datas
      security:
      - jwtAuth: []
      - tokenAuth: []
      - basicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBioDataList'
          description: ''
  /iclock/api/biodatas/{id}/:
    get:
      operationId: iclock_api_biodatas_retrieve
      description: BioDataList pagination, search, filter, order
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Bio-Data.
        required: true
      tags:
      - - Bio Datas
      security:
      - jwtAuth: []
      - tokenAuth: []
      - basicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BioData'
          description: ''
    delete:
      operationId: iclock_api_biodatas_destroy
      description: BioDataList pagination, search, filter, order
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Bio-Data.
        required: true
      tags:
