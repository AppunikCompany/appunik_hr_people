                $ref: '#/components/schemas/BioData'
          description: ''
      parameters:
      - name: emp_code
        in: query
        required: false
        schema:
          type: string
        description: ''
      - name: bio_no
        in: query
        required: false
        schema:
          type: string
        description: '`Bio-Index`'
      - name: bio_index
        in: query
        required: false
        schema:
          type: string
        description: '`Template Index`'
      - name: bio_type
        in: query
        required: false
        schema:
          type: string
        description: ''
      - name: sn
