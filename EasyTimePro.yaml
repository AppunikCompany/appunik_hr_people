          - txt
        description: 'Export type: csv, xls, txt'
      - name: export_headers
        in: query
        required: false
        schema:
          type: string
        description: Headers split with "," & Allowed headers `['employee', 'bio_type',
          'bio_no', 'major_ver', 'minor_ver', 'sn']`
